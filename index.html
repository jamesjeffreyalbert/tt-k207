<title>Tube Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column. The live board comes first, then every way to get there,
   ranked by arrival time. Saved routes are big tap targets with the next train on them. */
:root{
  --paper:#EBEFF5; --surface:#FFFFFF; --ink:#0F1728; --muted:#586277; --line:#D3DAE5;
  --accent:#0B3D91; --accent-ink:#FFFFFF;
  --board:#070A10; --board-ink:#E9EDF4; --board-line:#1B2232; --board-muted:#9AA4B8; --amber:#FFB400; --board-dim:#8C7A45;
  --good:#0A7D3E; --good-ink:#FFFFFF; --warn-bg:#FFEFD0; --warn-ink:#7A4300; --bad-bg:#FDE1E4; --bad-ink:#9B0D20;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1018; --surface:#161B26; --ink:#E8ECF3; --muted:#9AA4B8; --line:#262E3F;
    --accent:#7C9BFF; --accent-ink:#0A1020;
    --board:#04060A; --board-line:#171D2B;
    --good:#3DBE7A; --good-ink:#06210F; --warn-bg:#3A2A0E; --warn-ink:#FFD28A; --bad-bg:#40141B; --bad-ink:#FFB3BD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1018; --surface:#161B26; --ink:#E8ECF3; --muted:#9AA4B8; --line:#262E3F;
  --accent:#7C9BFF; --accent-ink:#0A1020;
  --board:#04060A; --board-line:#171D2B;
  --good:#3DBE7A; --good-ink:#06210F; --warn-bg:#3A2A0E; --warn-ink:#FFD28A; --bad-bg:#40141B; --bad-ink:#FFB3BD;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font:700 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h1.small{font-size:28px;text-transform:none;letter-spacing:0;line-height:1.05}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-ink)}
.btn.ghost{background:transparent}
.btn:focus-visible,.route:focus-visible,.jhead:focus-visible,.res:focus-visible,.linkbtn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.route{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px}
.route .name{font:700 26px/1.1 var(--display)}
.route .sub{color:var(--muted);font-size:14px;margin-top:4px}
.glance{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.glance small{font-size:12px;color:var(--muted)}
.glance b{font:700 26px/1 var(--display);color:var(--accent)}
.glance b.none{font-size:17px;color:var(--bad-ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px}
.empty p{margin:0 0 12px;color:var(--muted)}
.meta{color:var(--muted);font-size:14px}
.meta b{color:var(--good);font-weight:600}
.note{color:var(--muted);font-size:14px;margin:10px 0}
.banner{background:var(--bad-bg);color:var(--bad-ink);border-radius:14px;padding:14px 16px;margin:0 0 14px;border-left:6px solid var(--bad-ink)}
.banner strong{display:block;font:700 22px/1.15 var(--display)}
.banner p{margin:6px 0 0;font-size:15px}
.banner .btn{margin-top:10px;color:var(--bad-ink);border-color:var(--bad-ink);background:transparent}
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;font-family:var(--display)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 16px/1.2 var(--body);color:var(--board-ink)}
.bsub{font:400 14px/1.35 var(--body);color:var(--board-muted);margin-top:6px}
.bstatus{font:400 13px/1.35 var(--body);margin-top:8px;color:var(--board-muted)}
.bstatus .ok{color:#6FD39A}
.bstatus .warn{color:#FFD28A}
.bstatus .bad{color:#FF9AA8}
.hero{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;flex-wrap:wrap}
.hero .big{font:700 56px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.hero .then{font:500 20px/1 var(--display);color:var(--board-dim)}
.herosub{font:400 14px/1.3 var(--body);color:var(--board-muted);margin-bottom:6px}
.warnline{font:500 14px/1.35 var(--body);background:#3A2A0E;color:#FFD28A;border-radius:8px;padding:8px 10px;margin:8px 0}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--board-line)}
.trow .dest{flex:1;min-width:0;font:600 21px/1.15 var(--display);letter-spacing:.01em;text-transform:uppercase}
.trow .dest small{display:block;font:400 13px/1.35 var(--body);text-transform:none;letter-spacing:0;color:var(--board-muted)}
.trow .dest .arr{color:#D9C38A}
.trow .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.trow .mins{font:700 27px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .clk{font:400 13px/1 var(--body);color:var(--board-muted);font-variant-numeric:tabular-nums}
.trow .tag{font:500 12px/1 var(--body);color:#FFD28A;border:1px solid #6B5320;border-radius:5px;padding:3px 6px;white-space:nowrap}
.trow.dim .dest,.trow.dim .mins{opacity:.45}
.trow.first{box-shadow:inset 4px 0 0 var(--amber);padding-left:10px;margin-left:-14px;padding-right:14px;margin-right:-14px}
.linkbtn{background:none;border:0;color:var(--amber);font:500 15px/1.2 var(--body);padding:12px 0 4px;text-align:left}
.msg{font:400 15px/1.4 var(--body);color:#C3CBDA;padding:6px 0}
.small-note{font:400 13px/1.35 var(--body);color:var(--board-muted);margin-top:10px}
.err{background:var(--bad-bg);color:var(--bad-ink);border-radius:12px;padding:14px;margin:12px 0}
.err p{margin:0 0 10px}
.section-title{font:700 26px/1.1 var(--display);margin:28px 0 4px}
.section-sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.direct{border-left:6px solid var(--accent)}
.jhead{display:block;width:100%;text-align:left;background:none;border:0;padding:14px}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.arrive{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.arrive span{font:500 18px/1 var(--display);color:var(--muted);white-space:nowrap}
.cmp{font:600 14px/1 var(--display);letter-spacing:.03em;padding:6px 8px;border-radius:6px;background:var(--paper);color:var(--ink);white-space:nowrap}
.cmp.best{background:var(--good);color:var(--good-ink)}
.cmp.none{background:var(--bad-bg);color:var(--bad-ink)}
.kicker{display:inline-block;font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{display:inline-block;font:600 14px/1 var(--display);letter-spacing:.02em;padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.walk{font-size:13px;color:var(--muted);padding:3px 7px;border:1px solid var(--line);border-radius:6px}
.firsttrain{font-size:15px;color:var(--muted);margin-top:10px}
.firsttrain b{color:var(--ink);font-weight:600}
.firsttrain .none{color:var(--bad-ink);font-weight:600}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad,.pill.closed{background:var(--bad-bg);color:var(--bad-ink)}
.jbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.legs{list-style:none;margin:12px 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.legs li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.legs .dur{margin-left:auto;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legs small{display:block;color:var(--muted)}
.field{margin:0 0 18px}
.field label{display:block;font-weight:600;margin-bottom:6px}
input[type=search],input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chosen{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.results{margin-top:6px;display:flex;flex-direction:column}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;padding:12px;background:var(--surface);border:1px solid var(--line);border-top-width:0}
.res:first-child{border-top-width:1px;border-radius:10px 10px 0 0}
.res:last-child{border-radius:0 0 10px 10px}
.res:only-child{border-radius:10px}
.res .modes{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:14px;padding:8px 2px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 18px}
.check input{width:22px;height:22px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:24px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.jbody{animation:fade .15s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<body>
<div class="app" id="app"></div>
<script>
const API='https://api.tfl.gov.uk';
const JOURNEY_MODES='tube,dlr,overground,elizabeth-line,tram,national-rail,walking';
const SEARCH_MODES='tube,dlr,overground,elizabeth-line,national-rail,tram';

/* ---------- pure logic (tested separately) ---------- */
// <logic>
const LIVE_MODES=new Set(['tube','dlr','overground','elizabeth-line','tram']);
function cleanName(n){
  return String(n||'').replace(/\s+/g,' ').trim()
    .replace(/ (Underground|DLR|Rail|Tram|Overground|Elizabeth line) (Station|Stop)$/i,'').trim();
}
function normName(n){
  return cleanName(n).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
const VIA_ALIASES={'cx':'charing cross','charing x':'charing cross','chx':'charing cross'};
function viaRaw(text){const m=/\bvia\s+(.+?)\s*$/i.exec(String(text||''));return m?m[1].trim():'';}
function parseVia(text){const r=viaRaw(text);if(!r)return null;const v=normName(r);return VIA_ALIASES[v]||v||null;}
function viaDisplay(text){const r=viaRaw(text);if(!r)return '';const a=VIA_ALIASES[normName(r)];return a?a.replace(/\b[a-z]/g,c=>c.toUpperCase()):r;}
// The station id on this line whose name matches the "via" text, or null if none or several match.
function findViaId(via,names){
  if(!via||!names) return null;
  const exact=[],prefix=[];
  Object.keys(names).forEach(id=>{const n=normName(names[id]);if(n===via)exact.push(id);else if(n.indexOf(via+' ')===0)prefix.push(id);});
  if(exact.length===1) return exact[0];
  if(!exact.length&&prefix.length===1) return prefix[0];
  return null;
}
// Routes a train could be running on from dep to its destination. A destination is where the train
// ends, so routes that finish there are preferred; routes passing through are a fallback (short workings).
function candRoutes(routes,dep,dest){
  const all=[],term=[];
  for(const ids of routes){
    const i=ids.indexOf(dep); if(i<0) continue;
    const k=ids.lastIndexOf(dest); if(k<=i) continue;
    all.push(ids); if(k===ids.length-1) term.push(ids);
  }
  return {all,term};
}
function verdictOf(set,dep,arr,dest){
  let pass=0;
  for(const ids of set){const i=ids.indexOf(dep),k=ids.lastIndexOf(dest),j=ids.indexOf(arr,i+1);if(j>i&&j<=k)pass++;}
  return pass===set.length?'yes':pass===0?'no':'maybe';
}
// For a train that says it runs via a station: on every route from dep to that station, is arr passed first?
function viaSegment(routes,dep,arr,via){
  let tot=0,pass=0;
  for(const ids of routes){const i=ids.indexOf(dep);if(i<0)continue;const v=ids.indexOf(via,i+1);if(v<0)continue;tot++;const j=ids.indexOf(arr,i+1);if(j>i&&j<=v)pass++;}
  return tot?(pass===tot?'yes':'maybe'):null;
}
// 'yes' | 'no' | 'maybe' | 'unknown', using the timetabled routes, the destination and any "via" text.
function routeVerdict(routes,dep,arr,dest,viaId){
  const known=!!dest&&routes.some(ids=>ids.indexOf(dest)>=0);
  if(known){
    const {all,term}=candRoutes(routes,dep,dest);
    const base=term.length?term:all;
    if(viaId){
      const vb=base.filter(ids=>ids.indexOf(viaId)>=0);
      if(vb.length) return {v:verdictOf(vb,dep,arr,dest),why:'via'};
      const va=all.filter(ids=>ids.indexOf(viaId)>=0);
      if(va.length) return {v:verdictOf(va,dep,arr,dest),why:'via'};
      return {v:viaSegment(routes,dep,arr,viaId)==='yes'?'yes':'maybe',why:'via'};
    }
    if(!base.length) return {v:'no',why:'route'};
    return {v:verdictOf(base,dep,arr,dest),why:'route'};
  }
  if(viaId){const seg=viaSegment(routes,dep,arr,viaId);if(seg)return {v:seg==='yes'?'yes':'maybe',why:'via'};}
  return {v:'unknown',why:'unknown'};
}
function findPair(routes,depIds,arrIds){
  for(const dep of depIds) for(const arr of arrIds){
    if(dep===arr) continue;
    if(routes.some(ids=>{const i=ids.indexOf(dep);return i>=0&&ids.indexOf(arr,i+1)>i;})) return {dep,arr};
  }
  return null;
}
function validVid(v){v=String(v==null?'':v).trim();return /\d/.test(v)&&!/^0+$/.test(v);}
function predAt(p,nowMs){const t=Date.parse(p.expectedArrival);return isFinite(t)?t:nowMs+(p.timeToStation||0)*1000;}
function median(a){const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;}
// Decide for each live train at dep whether it will call at arr.
// serves: 'yes' (confirmed), 'no' (does not), 'maybe' (TfL data can't tell yet).
function classifyRows(o){
  const nowMs=o.nowMs||Date.now(), routes=o.routes||[], line=o.line||'';
  const sameLine=p=>!line||!p.lineId||p.lineId===line;
  const list=[],keys=new Set();
  (o.preds||[]).filter(sameLine).map(p=>({p,at:predAt(p,nowMs)})).sort((a,b)=>a.at-b.at).forEach(x=>{
    const vid=validVid(x.p.vehicleId)?String(x.p.vehicleId).trim():'';
    const key=(vid||((x.p.platformName||'')+'/'+(x.p.destinationNaptanId||x.p.destinationName||x.p.towards||'')))+'|'+x.p.expectedArrival;
    if(keys.has(key)) return; keys.add(key);
    if(vid&&list.some(r=>r.vid===vid&&Math.abs(r.at-x.at)<90000)) return;
    list.push({p:x.p,at:x.at,vid});
  });
  const vidCount=new Map(); list.forEach(r=>{if(r.vid)vidCount.set(r.vid,(vidCount.get(r.vid)||0)+1);});
  const arrMap=new Map(); let haveArr=false;
  if(o.useVehicles&&Array.isArray(o.arrPreds)) o.arrPreds.filter(sameLine).forEach(p=>{
    if(!validVid(p.vehicleId)) return;

    (d.orderedLineRoutes||[]).forEach(r=>{if(Array.isArray(r.naptanIds)&&r.naptanIds.length>1)routes.push(r.naptanIds);});

    if(id&&LIVE_MODES.has(g.modeName)&&!lines.some(l=>l.id===id)) lines.push({id,mode:g.modeName});}));
  addId(own);

async function loadStatus(ids,nowMs){

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LINE_COLOURS={bakerloo:'#B36305',central:'#E32017',circle:'#FFD300',district:'#00782A','hammersmith-city':'#F3A9BB',jubilee:'#7B8085',metropolitan:'#9B0056',northern:'#1A1A1A',piccadilly:'#003688',victoria:'#0098D4','waterloo-city':'#76D0BD',dlr:'#00A4A7',elizabeth:'#6950A1','elizabeth-line':'#6950A1',lioness:'#FA7B05',mildmay:'#0071CE',windrush:'#ED1B00',weaver:'#832F5B',suffragette:'#5BBD72',liberty:'#676767',tram:'#5FB526','national-rail':'#444444'};
const LINE_NAMES={bakerloo:'Bakerloo',central:'Central',circle:'Circle',district:'District','hammersmith-city':'Hammersmith & City',jubilee:'Jubilee',metropolitan:'Metropolitan',northern:'Northern',piccadilly:'Piccadilly',victoria:'Victoria','waterloo-city':'Waterloo & City',dlr:'DLR',elizabeth:'Elizabeth line',liberty:'Liberty',lioness:'Lioness',mildmay:'Mildmay',suffragette:'Suffragette',weaver:'Weaver',windrush:'Windrush',tram:'Tram'};
function lineNameOf(id){return LINE_NAMES[id]||id;}
function lineLabel(name){name=String(name||'');return /\bline$/i.test(name)||/^dlr$/i.test(name)||/tram/i.test(name)?name:name+' line';}
function textOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>160?'#101010':'#FFFFFF';}
function chip(id,name){const c=LINE_COLOURS[id]||'#555B66';return '<span class="chip" style="background:'+c+';color:'+textOn(c)+'">'+esc(name||lineNameOf(id))+'</span>';}
function clock(ms){return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});}
function minsFromNow(ms,now){return Math.max(0,Math.round((ms-now)/60000));}

/* ---------- state ---------- */
const S={view:'home',route:null,reversed:false,loading:false,err:null,data:null,updated:null,open:{},showHidden:false,confirmDel:false,token:0,glance:{},form:null};
const $app=document.getElementById('app');

/* ---------- views ---------- */
function homeView(){
  const now=Date.now();
  const cards=store.routes.map(r=>{
    const g=S.glance[r.id];
    let right='<span class="glance"><small>Loading…</small></span>';
    if(g){
      if(g.err) right='<span class="glance"><small>Couldn’t load</small></span>';
      else if(g.none) right='<span class="glance"><small>No live times</small></span>';
      else if(g.at==null) right='<span class="glance"><small>Next train</small><b class="none">None showing</b></span>';
      else right='<span class="glance"><small>Next train</small><b>'+esc(minsLabel((g.at-now)/1000))+'</b>'+(g.change?'<small>change at '+esc(g.change)+'</small>':'')+'</span>';
    }
    return '<button class="route" data-act="open" data-id="'+esc(r.id)+'"><span><span class="name">'+esc(r.name)+'</span><div class="sub">'+esc(cleanName(r.from.name))+' → '+esc(cleanName(r.to.name))+'</div></span>'+right+'</button>';
  }).join('');
  return '<div class="top"><h1>Tube Times</h1><button class="btn primary" data-act="add">Add route</button></div>'+
    (store.routes.length?'<div class="stack">'+cards+'</div>':
     '<div class="empty"><p>Save the trips you make most, like home to work and back, then tap one to see which trains are really coming.</p><p>Tip: add this page to your Home Screen before saving routes, so they stay on your phone.</p><button class="btn primary" data-act="add">Add your first route</button></div>')+
    '<p class="foot">Live times from Transport for London. Saved routes stay on this device.</p>';
}
function formView(){
  const f=S.form;
  const picker=(which,label)=>{
    const v=f[which];
    return '<div class="field"><label for="q-'+which+'">'+label+'</label>'+
      (v?'<div class="chosen"><span>'+esc(cleanName(v.name))+'</span><button class="btn ghost" data-act="unpick" data-which="'+which+'">Change</button></div>':
        '<input type="search" id="q-'+which+'" data-which="'+which+'" placeholder="Start typing a station" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="results" id="res-'+which+'"></div>')+
      '</div>';
  };
  const defName=(f.from&&f.to)?cleanName(f.from.name)+' → '+cleanName(f.to.name):'';
  const defBack=(f.from&&f.to)?cleanName(f.to.name)+' → '+cleanName(f.from.name):'';
  const adding=f.mode==='add';
  return '<div class="top"><h1 class="small">'+(adding?'New route':'Edit route')+'</h1><button class="btn" data-act="cancel">Cancel</button></div>'+
    picker('from','From')+picker('to','To')+
    '<div class="field"><label for="name1">Name'+(adding?' (optional)':'')+'</label><input type="text" id="name1" value="'+esc(f.name1)+'" placeholder="'+esc(defName||'e.g. To work')+'"></div>'+
    (adding?'<label class="check"><input type="checkbox" id="both"'+(f.both?' checked':'')+'> Also save the return trip</label>'+
      (f.both?'<div class="field"><label for="name2">Return name (optional)</label><input type="text" id="name2" value="'+esc(f.name2)+'" placeholder="'+esc(defBack||'e.g. To home')+'"></div>':''):'')+
    '<div id="form-err" class="hint" role="alert"></div>'+
    '<button class="btn primary" data-act="save">'+(adding?'Save route':'Save changes')+'</button>';
}
function statusLine(lines,status){
  const parts=lines.map(l=>{
    const s=status[l.line]; if(!s) return '';
    if(s.level==='ok') return '<span class="ok">'+esc(lineLabel(l.lineName))+': good service</span>';
    return '<span class="'+(s.level==='warn'?'warn':'bad')+'">'+esc(lineLabel(l.lineName))+': '+esc(s.desc)+'</span>'+(s.reasons.length?'<br>'+s.reasons.map(esc).join('<br>'):'');
  }).filter(Boolean);
  return parts.length?'<div class="bstatus">'+parts.join('<br>')+'</div>':'';
}
function bannerHtml(D,now){
  const b=D.board; if(!b) return '';
  const first=firstYes(b.rows,now);
  const gap=first?(first.at-now)/1000:Infinity;
  const closed=b.lines.filter(l=>D.status[l.line]&&D.status[l.line].level==='closed');
  if(gap<1200&&!closed.length) return '';
  const arr=esc(b.arrName);
  let head,body='';
  if(closed.length){
    head=closed.map(l=>esc(lineLabel(l.lineName))+': '+esc(D.status[l.line].desc)).join(' · ');
    body+='<p>'+(first?'Next train that stops at '+arr+': '+esc(minsLabel(gap))+'.':'No train that stops at '+arr+' is showing.')+'</p>';
  }else head=first?'No train to '+arr+' for '+Math.floor(gap/60)+' min':'No train to '+arr+' is showing';
  const early=b.rows.find(r=>r.serves==='maybe'&&r.at>=now-30000&&(!first||r.at<first.at));
  if(early) body+='<p>A train due in '+esc(minsLabel((early.at-now)/1000))+' isn’t confirmed to stop at '+arr+'. Check the front of the train.</p>';
  const alt=(D.cards||[]).filter(c=>!c.direct&&c.est!=null).sort(byEst)[0];
  if(alt) body+='<p>Quickest other way: '+esc(describeCard(alt))+', arriving '+esc(clock(alt.est))+'.</p><button class="btn" data-act="toalts">See other ways</button>';
  else if(D.cards&&D.cards.length) body+='<button class="btn" data-act="toalts">See other ways</button>';
  return '<div class="banner" role="alert"><strong>'+head+'</strong>'+body+'</div>';
}
function boardHtml(D,now){
  const b=D.board;
  if(!b){
    if(D.boardErr) return '<div class="board"><div class="msg">Couldn’t load live trains. '+esc(errText(D.boardErr))+'</div></div>';
    if(D.planErr) return '<div class="board"><div class="msg">No direct train, and the journey planner didn’t answer. '+esc(errText(D.planErr))+'</div></div>';
    return '<div class="board"><div class="msg">No live departures for this trip. See the ways to get there below.</div></div>';
  }
  const rows=b.rows.filter(r=>r.at>=now-60000);
  const multi=b.lines.length>1;
  const head='<div class="bhead">'+b.lines.map(l=>chip(l.line,l.lineName)).join('')+'<span>'+esc(b.depName)+'</span></div>'+
    '<div class="bsub">'+(b.kind==='direct'?'Trains that stop at '+esc(b.arrName):'No direct train. These trains stop at '+esc(b.arrName)+(b.next?', '+esc(b.next):'')+'.')+'</div>'+
    statusLine(b.lines,D.status||{});
  if(b.failed&&!rows.length) return '<div class="board">'+head+'<div class="msg">Couldn’t load live trains. '+esc(errText(D.boardErr))+' Tap Refresh to try again.</div></div>';
  const yes=rows.filter(r=>r.serves==='yes');
  const first=yes.find(r=>r.at>=now-30000);
  let hero;
  if(first){
    const s=(first.at-now)/1000;
    const thens=yes.filter(r=>r!==first&&r.at>first.at).slice(0,2).map(r=>Math.max(0,Math.floor((r.at-now)/60000)));
    hero='<div class="hero"><span class="big">'+esc(minsLabel(s))+'</span>'+(thens.length?'<span class="then">then '+thens.join(', ')+' min</span>':'')+'</div>'+
      (first.arrAt?'<div class="herosub">'+(first.arrExact?'Arrives ':'Arrives about ')+esc(b.arrName)+' '+esc(clock(first.arrAt))+'</div>':'');
    if(s>=600&&s<1200) hero+='<div class="warnline">The next train that stops at '+esc(b.arrName)+' is '+Math.floor(s/60)+' min away.</div>';
  }else hero='<div class="warnline" style="margin-top:14px">No train that stops at '+esc(b.arrName)+' is showing right now.</div>';
  const rowHtml=(r,dim)=>{
    const s=(r.at-now)/1000;
    const sub1=[r.via?'via '+r.via:'',r.plat].filter(Boolean).join(' · ');
    const arrTxt=!dim&&r.serves==='yes'&&r.arrAt?'<small class="arr">'+(r.arrExact?'Arrives ':'Arrives about ')+esc(clock(r.arrAt))+'</small>':'';
    const tag=r.serves==='maybe'?'<span class="tag">Not confirmed</span>':'';
    return '<div class="trow'+(dim?' dim':'')+(!dim&&r===first?' first':'')+'"><div class="dest">'+(multi?chip(r.line,r.lineName)+' ':'')+esc(r.dest||'Check front of train')+
      (sub1?'<small>'+esc(sub1)+'</small>':'')+(r.loc?'<small>'+esc(r.loc)+'</small>':'')+arrTxt+'</div>'+
      '<div class="right">'+tag+'<span class="mins">'+esc(minsLabel(s))+'</span><span class="clk">'+esc(clock(r.at))+'</span></div></div>';
  };
  const main=rows.filter(r=>r.serves!=='no').slice(0,8);
  const hidden=rows.filter(r=>r.serves==='no');
  const anyMaybe=main.some(r=>r.serves==='maybe');
  return '<div class="board">'+head+hero+main.map(r=>rowHtml(r,false)).join('')+
    (anyMaybe?'<div class="small-note">Not confirmed: TfL hasn’t said yet whether this train stops at '+esc(b.arrName)+'. Check the front of the train.</div>':'')+
    (hidden.length?'<button class="linkbtn" data-act="hidden">'+(S.showHidden?'Hide':'Show')+' '+hidden.length+(hidden.length>1?' trains that don’t':' train that doesn’t')+' stop at '+esc(b.arrName)+'</button>'+
      (S.showHidden?hidden.slice(0,10).map(r=>rowHtml(r,true)).join(''):''):'')+
    '</div>';
}
function describeCard(c){
  if(c.synthetic) return lineLabel(c.lineName);
  const names=[...new Set(c.legs.filter(l=>!isWalk(l)).map(l=>lineLabel(legLineName(l))))];
  const last=c.legs[c.legs.length-1];
  let s=names.join(' + ')||'Walk';
  if(names.length&&last&&isWalk(last)&&last.duration>=3) s+=', then walk '+last.duration+' min';
  return s;
}
function cardHtml(c,best,now){
  const key=c.sig;
  const open=!!S.open[key];
  let cmp;
  if(c.est==null) cmp='<span class="cmp none">No train showing</span>';
  else if(best==null||c.est-best<30000) cmp='<span class="cmp best">Fastest</span>';
  else cmp='<span class="cmp">+'+Math.round((c.est-best)/60000)+' min</span>';
  const arrive=c.est!=null?'Arrives '+esc(clock(c.est))+' <span>· '+minsFromNow(c.est,now)+' min</span>':'Arrival unknown';
  const chips=c.synthetic?chip(c.line,c.lineName):c.legs.map(l=>isWalk(l)?(l.duration>=1?'<span class="walk">Walk '+l.duration+' min</span>':''):chip(legLine(l)||(l.mode&&l.mode.id),legLineName(l))).join('');
  let first='';
  if(c.kind==='live'){
    first=c.train?'Next train <b>'+esc(minsLabel((c.train.at-now)/1000))+'</b> from '+esc(c.depName)+' · '+esc(lineLabel(c.lineName)):
      '<span class="none">No train showing</span> on the '+esc(lineLabel(c.lineName))+' from '+esc(c.depName);
  }else if(c.kind==='estimate') first='Live times don’t reach that far ahead yet, so this uses the timetable.';
  else if(c.kind==='timetable') first='Timetable only'+(c.firstAt?': leaves '+esc(c.depName)+' at <b>'+esc(clock(c.firstAt))+'</b>':'');
  else first='Walk all the way';
  const pills=(c.lineIds||[]).map(id=>{const s=S.data.status[id];if(!s||s.level==='ok')return '';return '<span class="pill '+s.level+'">'+esc(lineLabel(s.name||lineNameOf(id)))+': '+esc(s.desc)+'</span>';}).filter(Boolean).join(' ');
  let body='';
  if(open){
    let list;
    if(c.synthetic) list='<li><span>'+esc(lineLabel(c.lineName))+' to '+esc(c.arrName)+'<small>'+esc(c.depName)+' → '+esc(c.arrName)+'</small></span>'+(c.train&&c.train.arrAt?'<span class="dur">'+Math.round((c.train.arrAt-c.train.at)/60000)+' min</span>':'')+'</li>';
    else list=c.legs.map(l=>{
      const w=isWalk(l);
      const stops=l.path&&l.path.stopPoints?Math.max(0,l.path.stopPoints.length-1):0;
      return '<li><span>'+esc((l.instruction&&l.instruction.summary)||'')+(w?'':'<small>'+esc(cleanName(l.departurePoint&&l.departurePoint.commonName))+' → '+esc(cleanName(l.arrivalPoint&&l.arrivalPoint.commonName))+(stops?' · '+stops+' stop'+(stops>1?'s':''):'')+'</small>')+'</span><span class="dur">'+(l.duration||0)+' min</span></li>';
    }).join('');
    const reasons=(c.lineIds||[]).map(id=>{const s=S.data.status[id];return s&&s.level!=='ok'?s.reasons.map(x=>'<p class="note">'+esc(x)+'</p>').join(''):'';}).join('');
    body='<div class="jbody"><ul class="legs">'+list+'</ul>'+reasons+'</div>';
  }
  return '<div class="card'+(c.direct?' direct':'')+'"><button class="jhead" data-act="toggle" data-key="'+esc(key)+'" aria-expanded="'+open+'">'+
    (c.direct?'<span class="kicker">Direct</span>':'')+
    '<div class="cardtop"><div class="arrive">'+arrive+'</div>'+cmp+'</div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="firsttrain">'+first+'</div>'+
    (pills?'<div class="chips">'+pills+'</div>':'')+'</button>'+body+'</div>';
}
function cardsHtml(D,now){
  const cards=D.cards||[];
  let h='<h2 class="section-title" id="alts">Ways to get there</h2><p class="section-sub">Ranked by arrival time. Times use the live first train; changes and walks after that are timetable estimates.</p>';
  if(!cards.length){
    h+=D.planErr?'<div class="err"><p>Couldn’t load other ways. '+esc(errText(D.planErr))+'</p></div>':'<p class="note">No journeys found.</p>';
    return h;
  }
  const ests=cards.filter(c=>c.est!=null).map(c=>c.est);
  const best=ests.length?Math.min(...ests):null;
  return h+'<div class="stack">'+cards.map(c=>cardHtml(c,best,now)).join('')+'</div>';
}
function routeView(){
  const r=S.route, now=Date.now();
  const from=S.reversed?r.to:r.from, to=S.reversed?r.from:r.to;
  const upd=S.loading?'Updating…':(S.updated?'<b>Live</b> · updated '+esc(S.updated.toLocaleTimeString('en-GB',{timeZone:'Europe/London'})):'');
  const D=S.data;
  return '<div class="top"><button class="btn" data-act="back">‹ Routes</button><button class="btn ghost" data-act="edit">Edit</button></div>'+
    '<p class="eyebrow">'+esc(S.reversed?'Reversed':r.name)+'</p>'+
    '<h1 class="small">'+esc(cleanName(from.name))+' → '+esc(cleanName(to.name))+'</h1>'+
    '<div class="row-actions"><button class="btn" data-act="reverse">Reverse</button><button class="btn" data-act="refresh">Refresh</button></div>'+
    '<div class="meta" aria-live="polite" style="margin-bottom:12px">'+upd+'</div>'+
    (S.err?'<div class="err" role="alert"><p>'+esc(S.err)+'</p><button class="btn" data-act="refresh">Try again</button></div>':'')+
    (D?bannerHtml(D,now)+boardHtml(D,now)+cardsHtml(D,now):(S.loading?'<div class="board"><div class="msg">Loading live trains…</div></div>':''))+
    (S.confirmDel?'<div class="confirm"><span>Remove this route?</span><button class="btn danger" data-act="delyes">Remove</button><button class="btn" data-act="delno">Keep</button></div>':
      '<div class="confirm"><button class="btn ghost" data-act="del">Remove this route</button></div>')+
    '<p class="foot">Live times from Transport for London. The board updates every 30 seconds.</p>';
}
function render(){
  if(S.view==='home') $app.innerHTML=homeView();
  else if(S.view==='form') $app.innerHTML=formView();
  else $app.innerHTML=routeView();
}

/* ---------- actions ---------- */
async function refreshRoute(force){
  const token=++S.token; S.loading=true;
  if(force) memo.clear();
  render();
  try{
    const data=await computeRoute(S.route,S.reversed,{cards:true,force});
    if(token!==S.token) return;
    S.data=data; S.err=null; S.updated=new Date();
  }catch(e){
    if(token!==S.token) return;
    S.err=errText(e);
  }
  S.loading=false; render();
}
let glanceBusy=false;
async function refreshGlances(){
  if(glanceBusy) return; glanceBusy=true;
  try{
    await Promise.all(store.routes.map(async r=>{
      try{
        const res=await computeRoute(r,false,{cards:false});
        const t=res.board?firstYes(res.board.rows,Date.now()):null;
        S.glance[r.id]={none:!res.board||(res.board.failed&&!res.board.rows.length),at:t?t.at:null,change:res.board&&res.board.kind==='firstleg'?res.board.arrName:null};
      }catch(e){S.glance[r.id]={err:true};}
    }));
  }finally{glanceBusy=false;}
  if(S.view==='home') render();
}
setInterval(()=>{
  if(document.hidden) return;
  if(S.view==='route'&&!S.loading) refreshRoute(false);
  else if(S.view==='home') refreshGlances();
},30000);
setInterval(()=>{if(!document.hidden&&(S.view==='route'||S.view==='home'))render();},10000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  if(S.view==='route'&&!S.loading) refreshRoute(false);
  else if(S.view==='home') refreshGlances();
});
function openRoute(id){
  const r=store.routes.find(x=>x.id===id); if(!r) return;
  Object.assign(S,{view:'route',route:r,reversed:false,data:null,updated:null,err:null,open:{},showHidden:false,confirmDel:false});
  window.scrollTo(0,0); refreshRoute(false);
}
function goHome(){S.view='home';S.token++;S.loading=false;render();refreshGlances();}
function newForm(mode,r){
  if(mode==='edit') return {mode,id:r.id,from:r.from,to:r.to,name1:r.name,name2:'',both:false,res:{from:[],to:[]}};
  return {mode:'add',from:null,to:null,name1:'',name2:'',both:true,res:{from:[],to:[]}};
}
function keepNames(){const a=document.getElementById('name1'),b=document.getElementById('name2');if(a)S.form.name1=a.value;if(b)S.form.name2=b.value;}
let searchTimer=null;
function onSearch(which,q){
  clearTimeout(searchTimer);
  const box=document.getElementById('res-'+which); if(!box) return;
  q=q.trim();
  if(q.length<2){box.innerHTML='';return;}
  box.innerHTML='<div class="hint">Searching…</div>';
  searchTimer=setTimeout(async()=>{
    try{
      const r=await tfl('/StopPoint/Search',{query:q,modes:SEARCH_MODES,maxResults:10});
      const inp=document.getElementById('q-'+which); if(!inp||inp.value.trim()!==q) return;
      const seen=new Set(); const m=(r.matches||[]).filter(x=>x.id&&!seen.has(x.id)&&seen.add(x.id)).slice(0,8);
      S.form.res[which]=m;
      box.innerHTML=m.length?m.map((x,i)=>'<button class="res" data-act="pick" data-which="'+which+'" data-i="'+i+'"><span>'+esc(cleanName(x.name))+'</span><span class="modes">'+esc((x.modes||[]).map(s=>s==='national-rail'?'rail':s==='elizabeth-line'?'Elizabeth line':s).join(', '))+'</span></button>').join(''):'<div class="hint">No stations found.</div>';
    }catch(e){box.innerHTML='<div class="hint">'+esc(errText(e))+'</div>';}
  },250);
}
function newId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function saveForm(){
  keepNames();
  const f=S.form, err=document.getElementById('form-err');
  if(!f.from||!f.to){err.textContent='Pick both stations from the lists.';return;}
  if(f.from.id===f.to.id){err.textContent='Choose two different stations.';return;}
  const fr=f.from,to=f.to;
  const n1=(f.name1||'').trim()||cleanName(fr.name)+' → '+cleanName(to.name);
  if(f.mode==='edit'){
    const r=store.routes.find(x=>x.id===f.id);
    if(r){r.name=n1;r.from=fr;r.to=to;}
    saveStore(); S.form=null;
    if(r){openRoute(r.id);return;}
    goHome(); return;
  }
  store.routes.push({id:newId(),name:n1,from:fr,to:to});
  if(f.both){
    const n2=(f.name2||'').trim()||cleanName(to.name)+' → '+cleanName(fr.name);
    store.routes.push({id:newId(),name:n2,from:JSON.parse(JSON.stringify(to)),to:JSON.parse(JSON.stringify(fr))});
  }
  saveStore(); S.form=null; goHome();
}
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='open') openRoute(el.dataset.id);
  else if(act==='add'){S.form=newForm('add');S.view='form';render();const q=document.getElementById('q-from');if(q)q.focus();}
  else if(act==='edit'){S.token++;S.loading=false;S.form=newForm('edit',S.route);S.view='form';render();}
  else if(act==='cancel'){const f=S.form;S.form=null;if(f&&f.mode==='edit')openRoute(f.id);else goHome();}
  else if(act==='back') goHome();
  else if(act==='pick'){keepNames();const w=el.dataset.which;const x=S.form.res[w][+el.dataset.i];
    S.form[w]={id:x.id,name:x.name,ics:x.icsId||'',lat:x.lat,lon:x.lon};render();
    const nq=document.getElementById('q-to');if(w==='from'&&nq)nq.focus();}
  else if(act==='unpick'){keepNames();const w=el.dataset.which;S.form[w]=null;render();const q=document.getElementById('q-'+w);if(q)q.focus();}
  else if(act==='save') saveForm();
  else if(act==='reverse'){S.reversed=!S.reversed;S.data=null;S.open={};S.showHidden=false;refreshRoute(false);}
  else if(act==='refresh') refreshRoute(true);
  else if(act==='toggle'){const k=el.dataset.key;S.open[k]=!S.open[k];render();}
  else if(act==='hidden'){S.showHidden=!S.showHidden;render();}
  else if(act==='toalts'){const a=document.getElementById('alts');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(act==='del'){S.confirmDel=true;render();}
  else if(act==='delno'){S.confirmDel=false;render();}
  else if(act==='delyes'){store.routes=store.routes.filter(r=>r.id!==S.route.id);saveStore();goHome();}
});
$app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q-from'||t.id==='q-to') onSearch(t.dataset.which,t.value);
  else if(t.id==='name1') S.form.name1=t.value;
  else if(t.id==='name2') S.form.name2=t.value;
});
$app.addEventListener('change',e=>{
  if(e.target.id==='both'){keepNames();S.form.both=e.target.checked;render();}
});
render();
refreshGlances();
</script>
</body>
</html>
