<title>Tube Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column. Saved routes as big tap targets, journeys as cards,
   and a dark departure board for the live trains. */
:root{
  --paper:#EBEFF5; --surface:#FFFFFF; --ink:#0F1728; --muted:#586277; --line:#D3DAE5;
  --accent:#0B3D91; --accent-ink:#FFFFFF;
  --board:#070A10; --board-ink:#E9EDF4; --board-line:#1B2232; --amber:#FFB400; --board-dim:#8C7A45;
  --good:#0A7D3E; --warn-bg:#FFEFD0; --warn-ink:#7A4300; --bad-bg:#FDE1E4; --bad-ink:#9B0D20;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1018; --surface:#161B26; --ink:#E8ECF3; --muted:#9AA4B8; --line:#262E3F;
    --accent:#7C9BFF; --accent-ink:#0A1020;
    --board:#04060A; --board-line:#171D2B;
    --warn-bg:#3A2A0E; --warn-ink:#FFD28A; --bad-bg:#40141B; --bad-ink:#FFB3BD;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font:700 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h1.small{font-size:28px;text-transform:none;letter-spacing:0}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-ink)}
.btn.ghost{background:transparent}
.btn:focus-visible,.route:focus-visible,.jhead:focus-visible,.res:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.route{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px}
.route .name{font:700 26px/1.1 var(--display)}
.route .sub{color:var(--muted);font-size:14px;margin-top:4px}
.route .go{font:600 28px/1 var(--display);color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px}
.empty p{margin:0 0 12px;color:var(--muted)}
.meta{color:var(--muted);font-size:14px}
.meta b{color:var(--good);font-weight:600}
.note{color:var(--muted);font-size:14px;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.jhead{display:block;width:100%;text-align:left;background:none;border:0;padding:14px}
.jline1{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.jtimes{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.jnext{font:600 18px/1.1 var(--display);color:var(--ink);white-space:nowrap}
.jnext span{color:var(--muted);font-weight:500}
.jline2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.badge{display:inline-block;font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;font:600 14px/1 var(--display);letter-spacing:.02em;padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.walk{font-size:13px;color:var(--muted);padding:3px 7px;border:1px solid var(--line);border-radius:6px}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.jbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.legs{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.legs li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.legs .dur{margin-left:auto;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legs small{display:block;color:var(--muted)}
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:14px;font-family:var(--display)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 15px/1.2 var(--body);color:var(--board-ink)}
.bsub{font:400 13px/1.3 var(--body);color:#9AA4B8;margin-top:4px}
.hero{display:flex;align-items:baseline;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
.hero .big{font:700 52px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.hero .then{font:500 20px/1 var(--display);color:var(--board-dim)}
.warnline{font:500 14px/1.35 var(--body);background:#3A2A0E;color:#FFD28A;border-radius:8px;padding:8px 10px;margin:8px 0}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--board-line)}
.trow .dest{flex:1;min-width:0;font:600 20px/1.15 var(--display);letter-spacing:.01em;text-transform:uppercase}
.trow .dest small{display:block;font:400 13px/1.3 var(--body);text-transform:none;letter-spacing:0;color:#9AA4B8}
.trow .mins{font:700 26px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .tag{font:500 12px/1 var(--body);color:#9AA4B8;border:1px solid #2B3448;border-radius:5px;padding:3px 6px;white-space:nowrap}
.trow.dim .dest,.trow.dim .mins{opacity:.45}
.trow.first{box-shadow:inset 4px 0 0 var(--amber);padding-left:10px;margin-left:-14px;padding-right:14px;margin-right:-14px}
.linkbtn{background:none;border:0;color:var(--amber);font:500 14px/1.2 var(--body);padding:10px 0 2px;text-align:left}
.msg{font:400 15px/1.4 var(--body);color:#C3CBDA;padding:6px 0}
.err{background:var(--bad-bg);color:var(--bad-ink);border-radius:12px;padding:14px;margin:12px 0}
.err p{margin:0 0 10px}
.field{margin:0 0 18px}
.field label{display:block;font-weight:600;margin-bottom:6px}
input[type=search],input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chosen{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.results{margin-top:6px;display:flex;flex-direction:column}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;padding:12px;background:var(--surface);border:1px solid var(--line);border-top-width:0}
.res:first-child{border-top-width:1px;border-radius:10px 10px 0 0}
.res:last-child{border-radius:0 0 10px 10px}
.res:only-child{border-radius:10px}
.res .modes{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:14px;padding:8px 2px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 18px}
.check input{width:22px;height:22px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.jbody{animation:fade .15s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const API='https://api.tfl.gov.uk';
const LIVE_MODES=new Set(['tube','dlr','overground','elizabeth-line','tram']);
const JOURNEY_MODES='tube,dlr,overground,elizabeth-line,tram,national-rail,walking';

/* ---------- pure logic (tested separately) ---------- */
// <logic>
function cleanName(n){
  return String(n||'').replace(/ (Underground|DLR|Rail|Tram|Overground) (Station|Stop)$/,'').replace(/ (Station|Stop)$/,'').trim();
}
// true: a train heading for `dest` on some branch calls at dep then arr. false: none does. null: can't tell.
function routeServes(routes,dep,arr,dest){
  const destKnown=!!dest&&routes.some(ids=>ids.includes(dest));
  let found=false,pathExists=false;
  for(const ids of routes){
    const i=ids.indexOf(dep); if(i<0) continue;
    const j=ids.indexOf(arr,i+1); if(j<0) continue;
    pathExists=true;
    if(destKnown&&ids.lastIndexOf(dest)>=j) found=true;
  }
  if(!pathExists||!destKnown) return null;
  return found;
}
function classifyRows(preds,arrPreds,routes,dep,arr,legSec,nowMs){
  const verifiable=routes.some(ids=>{const i=ids.indexOf(dep);return i>=0&&ids.indexOf(arr,i+1)>i;});
  const arrByVeh=new Map();
  (arrPreds||[]).forEach(p=>{
    if(!p.vehicleId) return;
    const a=arrByVeh.get(p.vehicleId)||[]; a.push(p.timeToStation); arrByVeh.set(p.vehicleId,a);
  });
  const haveArr=!!(arrPreds&&arrPreds.length);
  const seen=new Set(); const rows=[];
  preds.slice().sort((a,b)=>a.timeToStation-b.timeToStation).forEach(p=>{
    const key=p.vehicleId+'|'+p.expectedArrival; if(seen.has(key)) return; seen.add(key);
    let serves=verifiable?routeServes(routes,dep,arr,p.destinationNaptanId):null;
    if(serves!==false&&haveArr&&p.vehicleId){
      const t=p.timeToStation;
      const later=(arrByVeh.get(p.vehicleId)||[]).some(x=>x>t&&x<t+5400);
      if(later) serves=true;
      else if(t+legSec<=1200) serves=false;   // should already be predicted at the next station, but isn't
      else serves=null;                        // too far away to be predicted there yet
    }
    let at=Date.parse(p.expectedArrival); if(!isFinite(at)) at=nowMs+p.timeToStation*1000;
    rows.push({at,dest:cleanName(p.destinationName||p.towards||''),plat:p.platformName||'',loc:p.currentLocation||'',serves,vid:p.vehicleId||''});
  });
  return rows;
}
function secsUntil(r,nowMs){return (r.at-nowMs)/1000;}
function tooSoon(r,walkSec,nowMs){return secsUntil(r,nowMs)<walkSec-30;}
function pickNext(rows,walkSec,nowMs){
  const ok=rows.filter(r=>r.serves!==false&&!tooSoon(r,walkSec,nowMs));
  return ok;
}
function minsLabel(secs){return secs<60?'Due':Math.floor(secs/60)+' min';}
function clock(ms){return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});}
// </logic>

/* ---------- storage ---------- */
const LS_KEY='tubetimes.routes.v1';
function loadStore(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&Array.isArray(s.routes))return s;}catch(e){}return {routes:[]};}
function saveStore(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
let store=loadStore();

/* ---------- API ---------- */
async function tfl(path,params){
  const url=new URL(API+path);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('TfL '+r.status);
  return r.json();
}
const memo=new Map();
function tflMemo(path,params,ttl=10000){
  const k=path+JSON.stringify(params||{}); const h=memo.get(k);
  if(h&&Date.now()-h.t<ttl) return h.p;
  const p=tfl(path,params); memo.set(k,{t:Date.now(),p}); p.catch(()=>memo.delete(k)); return p;
}
async function fetchJourneys(from,to){
  let f=from,t=to;
  for(let attempt=0;attempt<2;attempt++){
    const url=new URL(API+'/Journey/JourneyResults/'+encodeURIComponent(f)+'/to/'+encodeURIComponent(t));
    url.searchParams.set('mode',JOURNEY_MODES);
    let r;
    try{r=await fetch(url,{cache:'no-store'});}catch(e){throw new Error('Couldn’t reach TfL. Check your connection and try again.');}
    if(r.status===300){
      let d=null; try{d=await r.json();}catch(e){}
      // TfL wants us to choose between several matches: take the best one for each end.
      const best=(dis,cur)=>{
        const o=dis&&dis.disambiguationOptions;
        if(!o||!o.length) return cur;
        const top=o.slice().sort((a,b)=>(b.matchQuality||0)-(a.matchQuality||0))[0];
        return top.parameterValue||cur;
      };
      if(d&&attempt===0){f=best(d.fromLocationDisambiguation,f);t=best(d.toLocationDisambiguation,t);continue;}
      throw new Error('TfL couldn’t match one of the stations (300). Remove this route and add it again.');
    }
    if(r.status===404) throw new Error('TfL found no journey between these stations (404).');
    if(!r.ok) throw new Error('TfL returned an error ('+r.status+'). Try again in a moment.');
    const d=await r.json();
    return (d.journeys||[]).slice(0,4);
  }
  throw new Error('TfL couldn’t match the stations. Remove this route and add it again.');
}
const routeCache=new Map();
function getRoutes(lineId){
  if(!routeCache.has(lineId)){
    const p=Promise.all(['inbound','outbound'].map(d=>
      tfl('/Line/'+lineId+'/Route/Sequence/'+d,{serviceTypes:'Regular'})
        .then(r=>(r.orderedLineRoutes||[]).map(o=>o.naptanIds||[])).catch(()=>[])
    )).then(a=>a.flat());
    routeCache.set(lineId,p);
    p.then(r=>{if(!r.length) routeCache.delete(lineId);});
  }
  return routeCache.get(lineId);
}
function legLine(l){const o=l.routeOptions&&l.routeOptions[0];return o&&o.lineIdentifier?o.lineIdentifier.id:'';}
function legLineName(l){const o=l.routeOptions&&l.routeOptions[0];return (o&&o.lineIdentifier&&o.lineIdentifier.name)||(o&&o.name)||(l.mode&&l.mode.name)||'';}
async function loadLive(j){
  const legs=j.legs||[];
  const idx=legs.findIndex(l=>l.mode&&l.mode.id!=='walking');
  if(idx<0) return {none:true};
  const leg=legs[idx];
  const walkSec=legs.slice(0,idx).reduce((a,l)=>a+(l.duration||0)*60,0);
  const lineId=legLine(leg);
  const dep=leg.departurePoint&&leg.departurePoint.naptanId, arr=leg.arrivalPoint&&leg.arrivalPoint.naptanId;
  const base={leg,walkSec,lineId,lineName:legLineName(leg),depName:cleanName(leg.departurePoint&&leg.departurePoint.commonName),arrName:cleanName(leg.arrivalPoint&&leg.arrivalPoint.commonName)};
  if(!LIVE_MODES.has(leg.mode.id)||!lineId||!dep||!arr) return {...base,unsupported:true};
  const [preds,routes,arrPreds]=await Promise.all([
    tflMemo('/Line/'+lineId+'/Arrivals/'+dep),
    getRoutes(lineId),
    tflMemo('/Line/'+lineId+'/Arrivals/'+arr).catch(()=>null)
  ]);
  const rows=classifyRows(preds,arrPreds,routes,dep,arr,(leg.duration||0)*60,Date.now());
  return {...base,rows,fetchedAt:Date.now()};
}
async function loadStatus(){
  const ids=[...new Set(S.journeys.flatMap(j=>(j.legs||[]).filter(l=>l.mode&&LIVE_MODES.has(l.mode.id)).map(legLine)).filter(Boolean))];
  if(!ids.length){S.status={};return;}
  try{
    const arr=await tflMemo('/Line/'+ids.join(',')+'/Status');
    const m={};
    arr.forEach(l=>{
      const ls=(l.lineStatuses||[]).slice().sort((a,b)=>a.statusSeverity-b.statusSeverity)[0];
      if(ls) m[l.id]={sev:ls.statusSeverity,desc:ls.statusSeverityDescription,reason:ls.reason||''};
    });
    S.status=m;
  }catch(e){}
}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LINE_COLOURS={bakerloo:'#B36305',central:'#E32017',circle:'#FFD300',district:'#00782A','hammersmith-city':'#F3A9BB',jubilee:'#7B8085',metropolitan:'#9B0056',northern:'#1A1A1A',piccadilly:'#003688',victoria:'#0098D4','waterloo-city':'#76D0BD',dlr:'#00A4A7','elizabeth':'#6950A1','elizabeth-line':'#6950A1',lioness:'#FA7B05',mildmay:'#0071CE',windrush:'#ED1B00',weaver:'#832F5B',suffragette:'#5BBD72',liberty:'#676767',tram:'#5FB526','national-rail':'#444444'};
function textOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>160?'#101010':'#FFFFFF';}
function chip(id,name){const c=LINE_COLOURS[id]||'#555B66';return '<span class="chip" style="background:'+c+';color:'+textOn(c)+'">'+esc(name||id)+'</span>';}
function hhmm(iso){return iso?String(iso).slice(11,16):'';}

/* ---------- state ---------- */
const S={view:'home',route:null,reversed:false,loading:false,err:null,journeys:[],live:{},status:{},open:0,other:{},updated:null,confirmDel:false,token:0,
  add:{from:null,to:null,both:true,res:{from:[],to:[]},name1:'',name2:''}};
const $app=document.getElementById('app');

/* ---------- views ---------- */
function homeView(){
  const cards=store.routes.map(r=>'<button class="route" data-act="open" data-id="'+esc(r.id)+'"><span><span class="name">'+esc(r.name)+'</span><div class="sub">'+esc(cleanName(r.from.name))+' → '+esc(cleanName(r.to.name))+'</div></span><span class="go" aria-hidden="true">›</span></button>').join('');
  return '<div class="top"><h1>Tube Times</h1><button class="btn primary" data-act="add">Add route</button></div>'+
    (store.routes.length?'<div class="stack">'+cards+'</div>':
     '<div class="empty"><p>Save the trips you make most, like home to work and back, then tap one to see which trains are really coming.</p><p>Tip: add this page to your Home Screen before saving routes, so they stay on your phone.</p><button class="btn primary" data-act="add">Add your first route</button></div>')+
    '<p class="foot">Live times from Transport for London. Saved routes stay on this device.</p>';
}
function addView(){
  const a=S.add;
  const picker=(which,label)=>{
    const v=a[which];
    return '<div class="field"><label for="q-'+which+'">'+label+'</label>'+
      (v?'<div class="chosen"><span>'+esc(cleanName(v.name))+'</span><button class="btn ghost" data-act="unpick" data-which="'+which+'">Change</button></div>':
        '<input type="search" id="q-'+which+'" data-which="'+which+'" placeholder="Start typing a station" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="results" id="res-'+which+'"></div>')+
      '</div>';
  };
  const defName=(a.from&&a.to)?cleanName(a.from.name)+' → '+cleanName(a.to.name):'';
  const defBack=(a.from&&a.to)?cleanName(a.to.name)+' → '+cleanName(a.from.name):'';
  return '<div class="top"><h1 class="small">New route</h1><button class="btn" data-act="cancel">Cancel</button></div>'+
    picker('from','From')+picker('to','To')+
    '<div class="field"><label for="name1">Name (optional)</label><input type="text" id="name1" value="'+esc(a.name1)+'" placeholder="'+esc(defName||'e.g. Home to work')+'"></div>'+
    '<label class="check"><input type="checkbox" id="both"'+(a.both?' checked':'')+'> Also save the return trip</label>'+
    (a.both?'<div class="field"><label for="name2">Return name (optional)</label><input type="text" id="name2" value="'+esc(a.name2)+'" placeholder="'+esc(defBack||'e.g. Work to home')+'"></div>':'')+
    '<div id="add-err" class="hint" role="alert"></div>'+
    '<button class="btn primary" data-act="save">Save route</button>';
}
function statusFor(id){return S.status&&S.status[id];}
function journeyCard(j,i){
  const L=S.live[i]; const now=Date.now();
  const legs=j.legs||[];
  const chips=legs.map(l=>l.mode&&l.mode.id==='walking'?'<span class="walk">Walk '+(l.duration||0)+' min</span>':chip(legLine(l)||l.mode&&l.mode.id,legLineName(l))).join('');
  let next='',est='';
  if(L&&L.rows){
    const ok=pickNext(L.rows,L.walkSec,now);
    if(ok.length){
      const secs=secsUntil(ok[0],now);
      next='<div class="jnext">Next train <span>'+minsLabel(secs)+'</span></div>';
    }else next='<div class="jnext"><span>No train found</span></div>';
  }
  const lineIds=[...new Set(legs.filter(l=>l.mode&&LIVE_MODES.has(l.mode.id)).map(legLine).filter(Boolean))];
  const bad=lineIds.filter(id=>{const s=statusFor(id);return s&&s.sev<10;});
  const pills=bad.map(id=>{const s=statusFor(id);const nm=(legs.find(l=>legLine(l)===id)&&legLineName(legs.find(l=>legLine(l)===id)))||id;return '<span class="pill '+(s.sev<=6?'bad':'warn')+'">'+esc(nm)+': '+esc(s.desc)+'</span>';}).join(' ');
  const open=S.open===i;
  let body='';
  if(open){
    const legList=legs.map(l=>{
      const walking=l.mode&&l.mode.id==='walking';
      const stops=l.path&&l.path.stopPoints?Math.max(0,l.path.stopPoints.length-1):0;
      return '<li><span>'+esc((l.instruction&&l.instruction.summary)||'')+(walking?'':'<small>'+esc(cleanName(l.departurePoint&&l.departurePoint.commonName))+' → '+esc(cleanName(l.arrivalPoint&&l.arrivalPoint.commonName))+(stops?' · '+stops+' stop'+(stops>1?'s':''):'')+'</small>')+'</span><span class="dur">'+(l.duration||0)+' min</span></li>';
    }).join('');
    const reasons=bad.map(id=>{const s=statusFor(id);return s.reason?'<p class="note">'+esc(s.reason)+'</p>':'';}).join('');
    const good=!bad.length&&lineIds.length?'<p class="note">Good service on '+lineIds.map(id=>esc(legLineName(legs.find(l=>legLine(l)===id)))).join(', ')+'.</p>':'';
    body='<div class="jbody"><ul class="legs">'+legList+'</ul>'+reasons+good+boardHtml(i)+'</div>';
  }
  return '<div class="card"><button class="jhead" data-act="toggle" data-i="'+i+'" aria-expanded="'+open+'">'+
    '<div class="jline1"><div class="jtimes">'+esc(hhmm(j.startDateTime))+' → '+esc(hhmm(j.arrivalDateTime))+' <span class="meta">'+(j.duration||0)+' min</span></div>'+next+'</div>'+
    '<div class="jline2">'+chips+'</div>'+(pills?'<div class="jline2">'+pills+'</div>':'')+'</button>'+body+'</div>';
}
function boardHtml(i){
  const L=S.live[i]; const now=Date.now();
  if(!L) return '<div class="board"><div class="msg">Loading live times…</div></div>';
  if(L.error) return '<div class="board"><div class="msg">Couldn’t load live times for this trip. Tap Refresh to try again.</div></div>';
  if(L.none) return '';
  if(L.unsupported) return '<p class="note">Live times aren’t available for the first leg of this trip ('+esc(L.lineName)+').</p>';
  const main=L.rows.filter(r=>r.serves!==false);
  const hidden=L.rows.filter(r=>r.serves===false);
  const catchable=pickNext(L.rows,L.walkSec,now);
  const first=catchable[0];
  let hero='';
  if(first){
    const s=secsUntil(first,now);
    const thens=catchable.slice(1,3).map(r=>Math.max(0,Math.floor(secsUntil(r,now)/60))).join(', ');
    hero='<div class="hero"><span class="big">'+esc(minsLabel(s))+'</span>'+(thens?'<span class="then">then '+esc(thens)+' min</span>':'')+'</div>';
    if(s>=600) hero+='<div class="warnline">Long gap: the next train that goes where you’re going is '+Math.floor(s/60)+' minutes away. Check the other options above.</div>';
  }else hero='<div class="hero"><span class="big">–</span></div><div class="warnline">No train heading to '+esc(L.arrName)+' is showing right now.</div>';
  const rowHtml=(r,dim)=>{
    const s=secsUntil(r,now); const soon=tooSoon(r,L.walkSec,now);
    const tag=soon?'<span class="tag">Too soon</span>':(r.serves===null?'<span class="tag">Unconfirmed</span>':'');
    const isFirst=!dim&&first&&r===first;
    return '<div class="trow'+(dim||soon?' dim':'')+(isFirst?' first':'')+'"><div class="dest">'+esc(r.dest||'Check front of train')+'<small>'+esc([r.plat,r.loc].filter(Boolean).join(' · '))+'</small></div>'+tag+'<div class="mins">'+esc(minsLabel(s))+'</div></div>';
  };
  const showOther=!!S.other[i];
  return '<div class="board"><div class="bhead">'+chip(L.lineId,L.lineName)+'<span>'+esc(L.depName)+'</span></div>'+
    '<div class="bsub">Trains that call at '+esc(L.arrName)+(L.walkSec?' · includes '+Math.round(L.walkSec/60)+' min walk to the station':'')+'</div>'+
    hero+main.slice(0,6).map(r=>rowHtml(r,false)).join('')+
    (hidden.length?'<button class="linkbtn" data-act="other" data-i="'+i+'">'+(showOther?'Hide':'Show')+' '+hidden.length+(hidden.length>1?' trains that don’t':' train that doesn’t')+' stop at '+esc(L.arrName)+'</button>'+(showOther?hidden.slice(0,6).map(r=>rowHtml(r,true)).join(''):''):'')+
    '</div>';
}
function routeView(){
  const r=S.route; const from=S.reversed?r.to:r.from, to=S.reversed?r.from:r.to;
  const upd=S.loading?'Updating…':(S.updated?'<b>Live</b> · updated '+esc(S.updated.toLocaleTimeString('en-GB',{timeZone:'Europe/London'})):'');
  return '<div class="top"><button class="btn" data-act="back">‹ Routes</button></div>'+
    '<p class="eyebrow">'+esc(S.reversed?'Reversed':r.name)+'</p>'+
    '<h1 class="small">'+esc(cleanName(from.name))+' → '+esc(cleanName(to.name))+'</h1>'+
    '<div class="row-actions"><button class="btn" data-act="reverse">Reverse</button><button class="btn" data-act="refresh">Refresh</button></div>'+
    '<div class="meta" aria-live="polite" style="margin-bottom:12px">'+upd+'</div>'+
    (S.err?'<div class="err" role="alert"><p>'+esc(S.err)+'</p><button class="btn" data-act="refresh">Try again</button></div>':'')+
    '<div class="stack">'+S.journeys.map(journeyCard).join('')+'</div>'+
    (!S.journeys.length&&!S.err&&!S.loading?'<p class="note">No journeys found.</p>':'')+
    (S.confirmDel?'<div class="confirm"><span>Remove this route?</span><button class="btn danger" data-act="delyes">Remove</button><button class="btn" data-act="delno">Keep</button></div>':
      '<div class="confirm"><button class="btn ghost" data-act="del">Remove this route</button></div>')+
    '<p class="foot">Journey times are timetable estimates. The board shows live predictions from TfL.</p>';
}
function render(){
  if(S.view==='home') $app.innerHTML=homeView();
  else if(S.view==='add') $app.innerHTML=addView();
  else $app.innerHTML=routeView();
}

/* ---------- actions ---------- */
async function refreshAll(){
  const token=++S.token; S.loading=true; S.err=null; render();
  const r=S.route; const from=S.reversed?r.to:r.from, to=S.reversed?r.from:r.to;
  try{
    const js=await fetchJourneys(from.id,to.id);
    if(token!==S.token) return;
    S.journeys=js; S.live={}; S.open=0; S.other={}; render();
    await refreshLive(token);
  }catch(e){
    if(token!==S.token) return;
    S.err=e.message||'Something went wrong.'; S.journeys=[];
  }
  if(token!==S.token) return;
  S.loading=false; render();
}
async function refreshLive(token){
  await Promise.all(S.journeys.map(async(j,i)=>{
    try{const v=await loadLive(j); if(token===S.token) S.live[i]=v;}
    catch(e){if(token===S.token) S.live[i]={error:true};}
  }).concat([loadStatus()]));
  if(token===S.token) S.updated=new Date();
}
let liveTimer=null,tickTimer=null;
function startTimers(){
  stopTimers();
  liveTimer=setInterval(async()=>{
    if(S.view!=='route'||document.hidden||S.loading||!S.journeys.length) return;
    const t=S.token; await refreshLive(t); if(t===S.token&&S.view==='route') render();
  },30000);
  tickTimer=setInterval(()=>{if(S.view==='route'&&!document.hidden&&!S.loading) render();},10000);
}
function stopTimers(){clearInterval(liveTimer);clearInterval(tickTimer);}
document.addEventListener('visibilitychange',async()=>{
  if(!document.hidden&&S.view==='route'&&S.journeys.length&&!S.loading){const t=S.token;await refreshLive(t);if(t===S.token&&S.view==='route')render();}
});
function openRoute(id){
  const r=store.routes.find(x=>x.id===id); if(!r) return;
  S.view='route'; S.route=r; S.reversed=false; S.journeys=[]; S.live={}; S.status={}; S.updated=null; S.confirmDel=false; S.err=null;
  window.scrollTo(0,0); startTimers(); refreshAll();
}
function goHome(){S.view='home';S.token++;S.loading=false;stopTimers();render();}
function resetAdd(){S.add={from:null,to:null,both:true,res:{from:[],to:[]},name1:'',name2:''};}
let searchTimer=null;
function onSearch(which,q){
  clearTimeout(searchTimer);
  const box=document.getElementById('res-'+which); if(!box) return;
  q=q.trim();
  if(q.length<2){box.innerHTML='';return;}
  box.innerHTML='<div class="hint">Searching…</div>';
  searchTimer=setTimeout(async()=>{
    try{
      const r=await tfl('/StopPoint/Search',{query:q,modes:'tube,dlr,overground,elizabeth-line,national-rail',maxResults:10});
      const inp=document.getElementById('q-'+which); if(!inp||inp.value.trim()!==q) return;
      const seen=new Set(); const m=(r.matches||[]).filter(x=>x.id&&!seen.has(x.id)&&seen.add(x.id)).slice(0,8);
      S.add.res[which]=m;
      box.innerHTML=m.length?m.map((x,i)=>'<button class="res" data-act="pick" data-which="'+which+'" data-i="'+i+'"><span>'+esc(cleanName(x.name))+'</span><span class="modes">'+esc((x.modes||[]).map(s=>s==='national-rail'?'rail':s==='elizabeth-line'?'Elizabeth line':s).join(', '))+'</span></button>').join(''):'<div class="hint">No stations found.</div>';
    }catch(e){box.innerHTML='<div class="hint">Couldn’t reach TfL. Check your connection.</div>';}
  },250);
}
function newId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function saveAdd(){
  const a=S.add; const err=document.getElementById('add-err');
  if(!a.from||!a.to){err.textContent='Pick both stations from the lists.';return;}
  if(a.from.id===a.to.id){err.textContent='Choose two different stations.';return;}
  const f={id:a.from.id,name:a.from.name}, t={id:a.to.id,name:a.to.name};
  const n1=(a.name1||'').trim()||cleanName(f.name)+' → '+cleanName(t.name);
  store.routes.push({id:newId(),name:n1,from:f,to:t});
  if(a.both){
    const n2=(a.name2||'').trim()||cleanName(t.name)+' → '+cleanName(f.name);
    store.routes.push({id:newId(),name:n2,from:t,to:f});
  }
  saveStore(); resetAdd(); goHome();
}

$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='open') openRoute(el.dataset.id);
  else if(act==='add'){resetAdd();S.view='add';render();const q=document.getElementById('q-from');if(q)q.focus();}
  else if(act==='cancel'||act==='back') goHome();
  else if(act==='pick'){const w=el.dataset.which;const x=S.add.res[w][+el.dataset.i];S.add[w]=x;S.add.name1=(document.getElementById('name1')||{}).value||S.add.name1;render();const nq=document.getElementById('q-to');if(w==='from'&&nq)nq.focus();}
  else if(act==='unpick'){const w=el.dataset.which;S.add.name1=(document.getElementById('name1')||{}).value||'';S.add[w]=null;render();const q=document.getElementById('q-'+w);if(q)q.focus();}
  else if(act==='save') saveAdd();
  else if(act==='reverse'){S.reversed=!S.reversed;S.journeys=[];S.live={};refreshAll();}
  else if(act==='refresh') refreshAll();
  else if(act==='toggle'){const i=+el.dataset.i;S.open=S.open===i?-1:i;render();}
  else if(act==='other'){const i=+el.dataset.i;S.other[i]=!S.other[i];render();}
  else if(act==='del'){S.confirmDel=true;render();}
  else if(act==='delno'){S.confirmDel=false;render();}
  else if(act==='delyes'){store.routes=store.routes.filter(r=>r.id!==S.route.id);saveStore();goHome();}
});
$app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q-from'||t.id==='q-to') onSearch(t.dataset.which,t.value);
  else if(t.id==='name1') S.add.name1=t.value;
  else if(t.id==='name2') S.add.name2=t.value;
});
$app.addEventListener('change',e=>{
  if(e.target.id==='both'){S.add.both=e.target.checked;S.add.name1=(document.getElementById('name1')||{}).value||'';render();}
});
render();
</script>
</body>
</html>
